name: Build Thetis (NNR)

on:
  push:
    branches: [ nnr-hl2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      # The solution targets the VS2026 C++ toolset (v145). Use it if the runner has it,
      # otherwise fall back to the newest one installed (v143 = VS2022).
      - name: Pick C++ toolset
        id: toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $vsver = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
          Write-Host "Visual Studio: $vs ($vsver)"
          $major = [int]($vsver.Split('.')[0])
          if ($major -ge 18) { $pick = 'v145' } elseif ($major -eq 17) { $pick = 'v143' } else { throw "Visual Studio $vsver is too old" }
          Write-Host "Using toolset $pick"
          "toolset=$pick" >> $env:GITHUB_OUTPUT

      - name: Restore NuGet packages
        working-directory: Project Files/Source
        run: nuget restore Thetis_VS2026.sln

      - name: Build (Release x64)
        working-directory: Project Files/Source
        run: >
          msbuild Thetis_VS2026.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=${{ steps.toolset.outputs.toolset }}
          /m
          /v:minimal
          /fl "/flp:logfile=build.log;verbosity=normal"

      # MSI installer (same WiX v3 project mi0bot uses, renamed so it installs alongside his).
      # Use WiX v3 from the runner if present, otherwise fetch the 3.14 binaries.
      - name: Get WiX v3
        id: wix
        shell: pwsh
        run: |
          $dir = $null
          if ($env:WIX -and (Test-Path (Join-Path $env:WIX 'bin\candle.exe'))) { $dir = Join-Path $env:WIX 'bin' }
          if (-not $dir) {
            $dir = Join-Path $env:RUNNER_TEMP 'wix314'
            Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile "$env:RUNNER_TEMP\wix.zip"
            Expand-Archive "$env:RUNNER_TEMP\wix.zip" -DestinationPath $dir -Force
          }
          Get-ChildItem $dir -Filter *.targets | ForEach-Object { Write-Host $_.Name }
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Build installer (MSI)
        working-directory: Project Files/Source/Thetis-Installer
        run: >
          msbuild Thetis-Installer.wixproj
          /p:Configuration=Release
          /p:Platform=x64
          "/p:WixToolPath=${{ steps.wix.outputs.dir }}\\"
          "/p:WixTargetsPath=${{ steps.wix.outputs.dir }}\wix.targets"
          "/p:WixTasksPath=${{ steps.wix.outputs.dir }}\WixTasks.dll"
          "/p:WixExtDir=${{ steps.wix.outputs.dir }}"
          /v:minimal
          /fl "/flp:logfile=../installer.log;verbosity=normal"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Thetis-NNR-Installer
          path: Project Files/bin/Installers/*.msi
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            Project Files/Source/build.log
            Project Files/Source/installer.log
          if-no-files-found: ignore

      - name: Upload Thetis build
        uses: actions/upload-artifact@v4
        with:
          name: Thetis-NNR-x64-Release
          path: |
            Project Files/bin/x64/Release/
            !Project Files/bin/x64/Release/**/*.pdb
          if-no-files-found: error
